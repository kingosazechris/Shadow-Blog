<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Shadow Blog</title>
    <!-- Social Meta Tags (Injected by JS) -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">

    <!-- Fonts & Styles -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <style>
        .article-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .post-header {
            text-align: left;
            padding: var(--spacing-xl) 0 var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-md);
        }

        .post-meta {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .post-meta::after {
            content: '';
            height: 1px;
            background: var(--border-color);
            flex-grow: 1;
        }

        .post-content {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--spacing-xl);
        }

        .post-content h2 {
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .post-hero-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            display: block;
        }

        /* LinkedIn Funnel */
        .linkedin-connect {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: var(--spacing-md);
            border-radius: 8px;
            text-align: center;
            margin-top: var(--spacing-lg);
        }

        .linkedin-connect h3 {
            margin-bottom: var(--spacing-sm);
        }

        .btn-linkedin {
            background: #0077b5;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: var(--spacing-sm);
            font-weight: 500;
        }

        .btn-linkedin:hover {
            background: #005582;
        }

        .spinner {
            border: 4px solid var(--bg-secondary);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Shadow Blog<span class="accent">.</span></a>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </nav>

    <main class="container article-container" id="post-container">
        <!-- Loading State -->
        <div class="spinner" id="loading-spinner"></div>

        <!-- Content injected here -->
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-brand">
                <h3>Shadow Blog</h3>
                <p style="max-width: 300px;">Tracking the evolution of intelligence; human and machine.</p>
            </div>
            <div class="footer-links" style="align-items: center;">
                <a href="https://www.linkedin.com/in/king-chris-a3b8aa333" target="_blank"
                    aria-label="LinkedIn Profile">
                    <img src="assets/linkedin.svg" alt="LinkedIn" style="width: 24px; height: 24px;">
                </a>
                <a href="index.html">Home</a>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Shadow Blog. All rights reserved.</p>
            </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
