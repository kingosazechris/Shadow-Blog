<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Blog | Premium Tech Insights</title>
    <meta name="description"
        content="A premium tech magazine featuring the latest insights on software development, design, and innovation.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Shadow<span class="accent">.</span></a>

            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section (Featured Post) -->
    <header class="hero" id="hero-section">
        <!-- Content injected by JS -->
        <div class="container hero-placeholder">
            <div class="skeleton-hero"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="section-header">
            <h2>Latest Stories</h2>
            <div class="divider"></div>
        </div>

        <div class="posts-grid" id="posts-grid">
            <!-- Posts injected by JS -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-brand">
                <h3>Shadow Blog</h3>
                <p style="max-width: 300px;">Unveiling groundbreaking innovations and the future of technology.</p>
            </div>
            <div class="footer-links" style="align-items: center;">
                <a href="https://www.linkedin.com/in/king-chris-a3b8aa333" target="_blank"
                    aria-label="LinkedIn Profile">
                    <img src="assets/linkedin.svg" alt="LinkedIn" style="width: 24px; height: 24px;">
                </a>
                <a href="about.html">About</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Shadow Blog. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>

</html>
